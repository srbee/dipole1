<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#05a8ed"><title>Dipole Length Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="poster">
<header class="scene"><div class="sign"><b>Dipole</b><strong>Length Calculator</strong></div><div class="cyclist" aria-label="Cartoon radio amateur riding a bicycle">👨🏻‍🦳<div class="radio">📻<i>)))</i></div><div class="bike">🚲</div></div><div class="tower">📡</div><div class="cloud">☁️</div></header>
<section class="antenna"><div class="post left"></div><div class="wire leftwire"><span id="leftMeasure">16 ft 5 in</span></div><div class="feedbox">▣<small>Coaxial cable</small></div><div class="wire rightwire"><span id="rightMeasure">16 ft 5 in</span></div><div class="post right"></div></section>
<form id="calcForm" class="controls"><input id="frequency" type="number" step="any" min=".1" max="1000" placeholder="Enter frequency here" aria-label="Frequency in MHz"><button class="go" type="submit">GO</button><button class="clear" id="clear" type="button">Clear</button></form>
<section class="answer"><div class="answer-label">Each side length<br><small>(one arm)</small></div><strong id="each">16 ft 5 in</strong><div class="divider"></div><div class="total-label">Total length<br><small>(both sides)</small><b id="total">32 ft 10 in</b></div></section>
<table><thead><tr><th>Frequency<br>(MHz)</th><th>Each side length<br>(feet + inches)</th><th>Total length<br>(feet + inches)</th></tr></thead><tbody id="rows"></tbody></table>
<footer>Each arm (ft) = <b>234 ÷ frequency (MHz)</b></footer><p id="error" role="alert"></p></main><script src="sketch.js"></script></body></html>
